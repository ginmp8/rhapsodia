name: Validate RhapsodIA 0.3.0 dual workflow package
on:
  push:
    branches: [build/dual-workflow-0.3.0]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Generate manifests
        run: |
          python scripts/generate_marketplace_manifests.py
          python scripts/generate_agent_manifest.py --package-version 0.3.0
      - name: Validate workflow control planes
        run: |
          python -m unittest discover -s skills/adaptive-workflow-orchestration/tests -p 'test_*.py' -v
          python skills/adaptive-workflow-orchestration/scripts/validate_dynamic_workflow.py skills/adaptive-workflow-orchestration/assets/templates/dynamic-workflow-plan.json.template
          python -m unittest discover -s skills/checkpoint-convergence/tests -p 'test_*.py' -v
          python skills/checkpoint-convergence/scripts/validate_convergence_plan.py skills/checkpoint-convergence/assets/templates/convergence-plan.json.template
      - name: Validate agents and release metadata
        run: |
          python scripts/validate_agents.py --target .
          python -m unittest tests.test_validate_agents tests.test_install_agents tests.test_marketplace_manifests tests.test_workspace_agent_contract tests.test_release_versions -v
          python scripts/generate_marketplace_manifests.py --check
          python scripts/generate_agent_manifest.py --check --package-version 0.3.0
          python scripts/validate_release_versions.py
          python scripts/prepare_release.py --check
      - name: Build deterministic archives twice
        run: |
          mkdir -p dist/a dist/b
          python scripts/build_release_archive.py --version 0.3.0 --output dist/a/rhapsodia-0.3.0-dual-workflow.zip
          python scripts/build_release_archive.py --version 0.3.0 --output dist/b/rhapsodia-0.3.0-dual-workflow.zip
          cmp dist/a/rhapsodia-0.3.0-dual-workflow.zip dist/b/rhapsodia-0.3.0-dual-workflow.zip
          unzip -t dist/a/rhapsodia-0.3.0-dual-workflow.zip
          sha256sum dist/a/rhapsodia-0.3.0-dual-workflow.zip
      - uses: actions/upload-artifact@v4
        with:
          name: rhapsodia-0.3.0-dual-workflow
          path: dist/a/rhapsodia-0.3.0-dual-workflow.zip
          if-no-files-found: error
          retention-days: 30
