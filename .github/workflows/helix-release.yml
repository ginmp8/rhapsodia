name: Validate RhapsodIA 0.14.0 release
on:
  push:
    branches: [main, "release/**", "build/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check committed manifests
        run: |
          python scripts/generate_marketplace_manifests.py --check
          python scripts/generate_agent_manifest.py --check --package-version 0.14.0
      - name: Install test-only Python runner
        run: python -m pip install pytest==9.0.2
      - name: Validate workflow control planes
        run: |
          python -m unittest discover -s skills/adaptive-workflow-orchestration/tests -p 'test_*.py' -v
          python skills/adaptive-workflow-orchestration/scripts/validate_dynamic_workflow.py skills/adaptive-workflow-orchestration/assets/templates/dynamic-workflow-plan.json.template
          python -m unittest discover -s skills/checkpoint-convergence/tests -p 'test_*.py' -v
          python skills/checkpoint-convergence/scripts/validate_convergence_plan.py skills/checkpoint-convergence/assets/templates/convergence-plan.json.template
      - name: Validate retained control-surface contracts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python skills/decision-engine/tests/test_top100_contract.py
          python -m unittest discover -s skills/reproducibility-engineer/tests -p 'test_context_loading_contract.py' -v
          python -m unittest discover -s skills/research-traceability/tests -p 'test_context_loading.py' -v
          python -m pytest -q --import-mode=importlib -p no:cacheprovider skills/skill-booster/tests/test_top100_context_contract.py
          python -m pytest -q --import-mode=importlib -p no:cacheprovider skills/skill-creator-juiced/tests/test_top100_context_contract.py
          python skills/skill-evolution/scripts/validate_skill_evolution.py --target skills/skill-evolution
          python skills/systematic-debugging/scripts/validate_skill.py
          python -m pytest -q --import-mode=importlib -p no:cacheprovider skills/skill-booster/tests/test_operational_quality_contracts.py
          python -m pytest -q --import-mode=importlib -p no:cacheprovider skills/skill-creator-juiced/tests/test_operational_quality_contracts.py
      - name: Validate 0.14.0 feature and skill integration
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -I -S -B -m unittest discover -s skills/reverse-engineering/tests -p 'test_*.py' -q
          python -I -S -B -m unittest discover -s skills/deep-research-suite/tests -p 'test_*.py' -q
          python -I -S -B -m unittest discover -s skills/premortem-analysis/tests -p 'test_*.py' -q
          python -B skills/premortem-analysis/scripts/validate_package.py skills/premortem-analysis
          python -B skills/premortem-analysis/scripts/validate_traceability.py skills/premortem-analysis/evidence/traceability.json --root skills/premortem-analysis
          python -B skills/premortem-analysis/scripts/validate_report.py skills/premortem-analysis/examples/messaging-migration.json
          python -I -S -B -m unittest discover -s skills/skill-token-efficient/tests -p 'test_*.py' -q
          python -m pytest -q --import-mode=importlib -p no:cacheprovider skills/skill-booster/tests skills/skill-creator-juiced/tests skills/skill-benchmark/tests
          python skills/skill-booster/scripts/validate_skill_booster.py --target skills/skill-booster
          python skills/skill-creator-juiced/scripts/juiced_quality_gate.py skills/skill-creator-juiced
          python skills/skill-benchmark/scripts/validate_portability.py --target skills/skill-benchmark --hosts all
          python -m pytest -q --import-mode=importlib -p no:cacheprovider skills/causal-flow-comprehension/tests skills/decision-engine/tests skills/prompt-architect/tests skills/visual-code-intelligence/tests
          python -I -S -B skills/causal-flow-comprehension/scripts/validate_skill.py skills/causal-flow-comprehension
          python -I -S -B skills/decision-engine/scripts/validate_skill.py skills/decision-engine
      - name: Validate retained graph and PDF capabilities
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest discover -s skills/local-graph-engine/tests -p 'test_*.py' -v
          for test_file in skills/local-graph-explorer/tests/test_*.py; do
            python -m unittest discover -s skills/local-graph-explorer/tests -p "$(basename "$test_file")" -v
          done
          python -m unittest discover -s skills/pdf-workbench/tests -p 'test_*.py' -v
          python skills/pdf-workbench/scripts/validate_docs.py
          python skills/pdf-workbench/scripts/validate_capability_coverage.py
      - name: Validate runtime context and release integration
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -I -S -B -m unittest discover -s skills/runtime-harness/tests -p 'test_*.py' -v
          python -S -B -m unittest tests.test_runtime_integration -v
      - name: Clean generated Python caches
        run: find . -type d -name __pycache__ -prune -exec rm -rf {} +
      - name: Validate capability-discovery Skill and standalone installer
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -I -S -B -m unittest discover -s skills/capability-discovery/tests -p 'test_*.py' -v
          python -I -S -B -m unittest discover -s tests -p 'test_capability_routing.py' -v
      - name: Validate Software Improvement Loop Skill
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -I -S -B -m unittest discover -s skills/software-improvement-loop/scripts/tests -p 'test_*.py' -v
      - name: Validate agents and release metadata
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python scripts/validate_agents.py --target .
          python -m unittest tests.test_validate_agents tests.test_install_agents tests.test_marketplace_manifests tests.test_workspace_agent_contract tests.test_release_versions -v
          python scripts/generate_marketplace_manifests.py --check
          python scripts/generate_agent_manifest.py --check --package-version 0.14.0
          python scripts/validate_release_versions.py --expected-version 0.14.0
          python scripts/prepare_release.py --check
          python scripts/validate_release_source_manifest.py --version 0.14.0 --check
      - name: Build deterministic archives twice
        run: |
          mkdir -p dist/a dist/b
          python scripts/build_release_archive.py --version 0.14.0 --output dist/a/rhapsodia-0.14.0.zip
          python scripts/build_release_archive.py --version 0.14.0 --output dist/b/rhapsodia-0.14.0.zip
          cmp dist/a/rhapsodia-0.14.0.zip dist/b/rhapsodia-0.14.0.zip
          unzip -t dist/a/rhapsodia-0.14.0.zip
          sha256sum dist/a/rhapsodia-0.14.0.zip
      - uses: actions/upload-artifact@v4
        with:
          name: rhapsodia-0.14.0
          path: dist/a/rhapsodia-0.14.0.zip
          if-no-files-found: error
          retention-days: 30
