<div id="app">

    <input id="search" class="search" type="search" placeholder="Search nodes by id or label" aria-label="Search nodes">
    <select id="layout" aria-label="Graph layout">
      <option value="dagre">DAG</option><option value="radial">Radial</option><option value="circular">Circular</option><option value="grid">Grid</option><option value="force">Force (opt-in)</option>
    </select>
    <button id="reset" type="button">Reset view</button>
    <div class="grow"></div>
    <select id="theme" aria-label="Theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select>
  </header>
  <main class="workspace">
    <aside class="panel left" aria-label="Graph filters">
      <div class="section"><h2>Node kinds</h2><div id="kind-filters" class="filter-list"></div></div>
      <div class="section"><h2>Relations</h2><div id="relation-filters" class="filter-list"></div></div>
      <div class="section">
        <h2>Path</h2>
        <div class="path-controls"><input id="path-a" placeholder="From"><input id="path-b" placeholder="To"><button id="path-button" type="button">Highlight shortest path</button></div>
        <div id="path-result" class="path-result muted"></div>
      </div>
      <div class="section legend"><span><i class="swatch" style="background:var(--incoming)"></i>incoming</span><span><i class="swatch" style="background:var(--outgoing)"></i>outgoing</span></div>
    </aside>
    <section class="canvas-wrap" aria-label="Graph canvas"><div id="graph"></div><svg id="builtin" role="img" aria-label="Graph visualization"></svg><div id="empty">No nodes match the current filters.</div></section>
    <aside class="panel right" aria-label="Inspector">
      <div class="section"><h2>Inspector</h2><div id="inspector"><span class="muted">Select a node.</span></div></div>
      <div class="section"><h2>Projection</h2><div id="projection"></div></div>
    </aside>
  </main>
  <footer class="status"><span id="status"></span><span class="grow"></span><span id="stats"></span></footer>
</div>
<script id="graph-data" type="application/json">__GRAPH_DATA__</script>

    installBuiltinPanZoom(svg,viewport); if(state.layout==="force")setStatus("Force is not implemented in the offline fallback; deterministic circular placement is used.");
  }
  function installBuiltinPanZoom(svg,viewport){let tr=state.builtinTransform,drag=null;const apply=()=>viewport.setAttribute("transform",`translate(${tr.x} ${tr.y}) scale(${tr.k})`);apply();svg.onwheel=e=>{e.preventDefault();tr.k=Math.max(.25,Math.min(4,tr.k*(e.deltaY<0?1.12:.89)));apply();};svg.onpointerdown=e=>{if(e.target===svg||e.target===viewport){drag={x:e.clientX-tr.x,y:e.clientY-tr.y};svg.setPointerCapture(e.pointerId);}};svg.onpointermove=e=>{if(drag){tr.x=e.clientX-drag.x;tr.y=e.clientY-drag.y;apply();}};svg.onpointerup=()=>{drag=null;};}
  function renderCurrent(preserve=true) {
    const data=visibleData(); el("empty").style.display=data.nodes.length?"none":"grid"; el("stats").textContent=`${data.nodes.length} nodes · ${data.edges.length} edges${original.metadata?.truncated?" · bounded view":""}`;
    if(!data.nodes.length){if(state.graph){try{state.graph.destroy();}catch{}state.graph=null;}el("graph").replaceChildren();el("builtin").replaceChildren();return;}
    const wantsG6=config.backend!=="builtin"; const ok=wantsG6 && renderG6(data,preserve); if(!ok){renderBuiltin(data); if(wantsG6)setStatus("G6 unavailable; using the built-in offline renderer."); else setStatus("Built-in offline renderer.");}
  }
  function reset(){state.selected=null;clearPath();state.builtinTransform={x:0,y:0,k:1};renderInspector();renderCurrent(false);setStatus("View reset.");}
  function setupTheme(){let saved="system";try{saved=localStorage.getItem("local-graph-theme")||"system";}catch(_e){}el("theme").value=saved;document.documentElement.dataset.theme=saved;el("theme").addEventListener("change",()=>{document.documentElement.dataset.theme=el("theme").value;try{localStorage.setItem("local-graph-theme",el("theme").value);}catch(_e){}renderCurrent(false);});}
  function setupEvents(){el("layout").value=state.layout;el("layout").addEventListener("change",()=>{state.layout=el("layout").value;renderCurrent(false);});el("reset").addEventListener("click",reset);el("path-button").addEventListener("click",doPath);el("search").addEventListener("input",()=>{const q=el("search").value.trim().toLowerCase();if(!q)return;const matches=original.nodes.filter(n=>n.id.toLowerCase().includes(q)||n.label.toLowerCase().includes(q)||(n.aliases||[]).some(a=>String(a).toLowerCase().includes(q))).sort((a,b)=>a.label.localeCompare(b.label)||a.id.localeCompare(b.id));if(matches.length)selectNode(matches[0].id);});}
  renderFilters();renderProjection();renderInspector();setupTheme();setupEvents();setStatus(`Input ${config.source_sha256.slice(0,12)} · layout ${state.layout}`);renderCurrent(false);
})();
</script>
