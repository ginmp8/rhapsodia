[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "rhapsody-of-skills"
version = "0.1.0"
description = "A curated collection of agent skills, evaluation harnesses, benchmarks, and delivery workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["skills*", "evals*", "benchmarks*", "workflows*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
